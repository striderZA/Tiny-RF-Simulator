name: Build & Test

on:
  push:
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  # Check C++ code formatting with clang-format
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-format
        run: sudo apt-get install -y -qq clang-format-18
      - name: Check formatting
        run: |
          find src app core common tests test_engine \
            signal_generator amplifier spectrum_analyzer equalizer \
            node_graph splitter mixer adc coax pfb_channelizer iq_plot icon_registry \
            ideal_filter attenuator combiner touchstone logging \
            -name '*.cpp' -o -name '*.h' | \
            xargs clang-format-18 --dry-run --Werror

  # Lint pull request title for conventional commit format
  lint-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check conventional commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CI matrix: Linux (GCC 14 / Clang 18) and Windows (MSYS2 + MinGW-w64).
  # The project requires MinGW-w64 on Windows; MSVC is not supported.
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux GCC 14 (Debug)
            shell: bash
            cxx_compiler: g++-14
            c_compiler: gcc-14
            cmake_flags: -DGLFW_BUILD_WAYLAND=OFF
            build_type: Debug
            upload_artifacts: true
          - os: ubuntu-24.04
            label: Linux GCC 14 (Release)
            shell: bash
            cxx_compiler: g++-14
            c_compiler: gcc-14
            cmake_flags: -DGLFW_BUILD_WAYLAND=OFF
            build_type: Release
            upload_artifacts: false
          - os: ubuntu-24.04
            label: Linux Clang 18
            shell: bash
            cxx_compiler: clang++-18
            c_compiler: clang-18
            cmake_flags: -DGLFW_BUILD_WAYLAND=OFF
            build_type: Debug
            upload_artifacts: false
          - os: windows-latest
            label: Windows MinGW-w64
            shell: msys2 - {0}
            cxx_compiler: g++
            c_compiler: gcc
            cmake_flags: ""
            build_type: Debug
            upload_artifacts: true

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake pkg-config ccache xvfb \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev
          if [ "${{ matrix.cxx_compiler }}" = "clang++-18" ]; then
            sudo apt-get install -y -qq clang-18
          else
            sudo apt-get install -y -qq g++-14
          fi

      - name: Install Windows dependencies (MSYS2 + MinGW-w64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-mesa
      - name: ccache
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.label }}

      - name: Configure
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          ${{ matrix.cmake_flags }}
          ${{ runner.os == 'Linux' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache' || '' }}

      - name: Build
        run: cmake --build build

      - name: Test
        # On Linux, UI tests run under Xvfb. On Windows, tests run with Mesa software rendering.
        # Timeout prevents hung UI tests from blocking CI indefinitely. Visual regression tests
        # (visual_baseline_*) self-bootstrap their baseline PNGs on first run since none are
        # committed yet, so they are not excluded here.
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum ctest --test-dir build --output-on-failure --timeout 60 -E "Benchmark"
          else
            ctest --test-dir build --output-on-failure --timeout 60 -E "Benchmark|ADC DDC output grid spans"
          fi

      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-${{ runner.os }}-${{ matrix.label }}
          path: |
            build/output/
            build/Testing/
          retention-days: 7

      # Collect MinGW runtime DLLs so the Windows binary is portable
      - name: Collect MinGW runtime DLLs
        if: runner.os == 'Windows'
        run: |
          mkdir -p mingw-dlls
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            cp /mingw64/bin/$dll mingw-dlls/
          done

      # Upload build binaries as workflow artifacts (only on tag push, selected matrix entries)
      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          path: |
            build/bin/tiny-rf-simulator${{ runner.os == 'Windows' && '.exe' || '' }}
            mingw-dlls/

  # AddressSanitizer build to catch memory errors
  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake pkg-config g++-14 \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev
      - name: Configure (ASan)
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          -DGLFW_BUILD_WAYLAND=OFF
      - name: Build
        run: cmake --build build
      - name: Test (ASan)
        run: |
          cd build
          ASAN_OPTIONS=halt_on_error=1:detect_leaks=0 xvfb-run --auto-servernum ctest --output-on-failure --timeout 60 -E "Benchmark"

  # Code coverage with gcov/lcov, uploaded to Codecov
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake pkg-config g++-14 lcov \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev
      - name: Configure (coverage)
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DGLFW_BUILD_WAYLAND=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: xvfb-run --auto-servernum ctest --test-dir build --output-on-failure --timeout 60 -E "Benchmark"
      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info --gcov-tool gcov-14 --ignore-errors source
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' '*/test_engine/*' --output-file coverage.info
          lcov --list coverage.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Create a GitHub Release (draft) with auto-generated changelog and binaries
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need full history + tags for git-cliff

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(grep -oP 'VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match CMakeLists.txt version ($CMAKE_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION == $CMAKE_VERSION"

      - name: Generate release notes
        run: |
          npm install -g git-cliff --silent
          git-cliff --config cliff.toml --latest --strip header -o release-notes.md
          echo "Release notes generated:"
          cat release-notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Linux binary
        run: |
          cp artifacts/build-linux/build/bin/tiny-rf-simulator rf-simulator-linux
          chmod +x rf-simulator-linux
          tar czf rf-simulator-linux-x86_64.tar.gz rf-simulator-linux

      - name: Package Windows binary + DLLs
        run: |
          mkdir -p rf-simulator-windows
          cp artifacts/build-windows/build/bin/tiny-rf-simulator.exe rf-simulator-windows/
          cp artifacts/build-windows/mingw-dlls/*.dll rf-simulator-windows/ 2>/dev/null || true
          zip -r rf-simulator-windows-x86_64.zip rf-simulator-windows/

      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            rf-simulator-linux-x86_64.tar.gz
            rf-simulator-windows-x86_64.zip
          draft: true
