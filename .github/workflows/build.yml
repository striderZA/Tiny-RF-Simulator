name: Build & Test

on:
  push:
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  # CI matrix: Linux (apt + GCC 14) and Windows (MSYS2 + MinGW-w64).
  # The project requires MinGW-w64 on Windows; MSVC is not supported.
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux (GCC 14)
            shell: bash
            cxx_compiler: g++-14
            c_compiler: gcc-14
            cmake_flags: -DGLFW_BUILD_WAYLAND=OFF
          - os: windows-latest
            label: Windows (MinGW-w64)
            shell: msys2 - {0}
            cxx_compiler: g++
            c_compiler: gcc
            cmake_flags: ""

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake pkg-config g++-14 libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Install Windows dependencies (MSYS2 + MinGW-w64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config

      - name: Configure
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build

      - name: Test
        # Exclude benchmarks (-E Benchmark) and UI tests (-E test_ui) because
        # the latter need an X display (Xvfb) which is not set up in this job.
        # Also exclude the catch_discover_tests concatenation quirk on Windows
        # where many test cases are joined with ; into one unparseable entry.
        run: ctest --test-dir build --output-on-failure -E "Benchmark|test_ui|ADC DDC output grid spans"

      # Collect MinGW runtime DLLs so the Windows binary is portable
      - name: Collect MinGW runtime DLLs
        if: runner.os == 'Windows'
        run: |
          mkdir -p mingw-dlls
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            cp /mingw64/bin/$dll mingw-dlls/
          done

      # Upload build binaries as workflow artifacts (only on tag push)
      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          path: |
            build/bin/tiny-rf-simulator${{ runner.os == 'Windows' && '.exe' || '' }}
            mingw-dlls/

  # Create a GitHub Release (draft) with auto-generated changelog and binaries
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need full history + tags for git-cliff

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(grep -oP 'VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match CMakeLists.txt version ($CMAKE_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION == $CMAKE_VERSION"

      - name: Generate release notes
        run: |
          npm install -g git-cliff --silent
          git-cliff --config cliff.toml --latest --strip header -o release-notes.md
          echo "Release notes generated:"
          cat release-notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Linux binary
        run: |
          cp artifacts/build-linux/build/bin/tiny-rf-simulator rf-simulator-linux
          chmod +x rf-simulator-linux
          tar czf rf-simulator-linux-x86_64.tar.gz rf-simulator-linux

      - name: Package Windows binary + DLLs
        run: |
          mkdir -p rf-simulator-windows
          cp artifacts/build-windows/build/bin/tiny-rf-simulator.exe rf-simulator-windows/
          cp artifacts/build-windows/mingw-dlls/*.dll rf-simulator-windows/ 2>/dev/null || true
          zip -r rf-simulator-windows-x86_64.zip rf-simulator-windows/

      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            rf-simulator-linux-x86_64.tar.gz
            rf-simulator-windows-x86_64.zip
          draft: true