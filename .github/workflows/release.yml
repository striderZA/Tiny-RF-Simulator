name: Release

on:
  push:
    tags:
      - "v*"

env:
  # MinGW-w64 silently drops TEST_CASEs past a ceiling in the main `tests`
  # binary. The build-and-test action fails its Windows legs when the registered
  # count drops below this verified floor; bump it when the count changes.
  MINGW_TEST_CASE_FLOOR: "227"

permissions:
  contents: read

jobs:
  classify-release:
    runs-on: ubuntu-24.04
    outputs:
      # JSON array of build legs for strict-build's matrix. Patch tags get a
      # single Linux GCC Debug leg; minor/major tags add Linux Clang and MinGW Debug.
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - name: Classify tag and build the validation matrix
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: tag '$TAG' is not semantic version X.Y.Z"
            exit 1
          fi
          PATCH="${BASH_REMATCH[3]}"
          LINUX='{"os":"ubuntu-24.04","shell":"bash","cxx_compiler":"g++-14","c_compiler":"gcc-14","cmake_flags":"-DGLFW_BUILD_WAYLAND=OFF"}'
          if [ "$PATCH" = "0" ]; then
            MATRIX=$(jq -c -n --argjson linux "$LINUX" '[
              $linux + {label:"Linux GCC 14 (Debug)", build_type:"Debug"},
              $linux + {label:"Linux Clang 18", build_type:"Debug", cxx_compiler:"clang++-18", c_compiler:"clang-18"},
              {os:"windows-latest", label:"Windows MinGW-w64", shell:"msys2 - {0}", cxx_compiler:"g++", c_compiler:"gcc", cmake_flags:"", build_type:"Debug"}
            ]')
          else
            MATRIX=$(jq -c -n --argjson linux "$LINUX" '[
              $linux + {label:"Linux GCC 14 Debug (patch validation)", build_type:"Debug"}
            ]')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "validation matrix: $MATRIX"

  validate-version:
    needs: classify-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify version and changelog entry
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(grep -oP 'VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match CMakeLists.txt version ($CMAKE_VERSION)"
            exit 1
          fi
          if ! bash scripts/release-notes.sh "$TAG_VERSION" > /dev/null; then
            exit 1
          fi
          echo "Version and changelog checks passed for $TAG_VERSION"

  # No pull-request pipeline exists. Release validation runs only on release
  # tags: format and sanitizer on every tag; strict-build's leg list is chosen
  # by classify-release (one Linux GCC Debug leg for patch tags, plus Linux
  # Clang and MinGW Debug legs for minor/major tags). Release configurations
  # are built only by the package job. docs.yml is separate and is not
  # tag-gated.
  format:
    needs: classify-release
    runs-on: ubuntu-24.04
    name: Format check
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-18
      - name: Check formatting
        # scripts/format.sh is the single source of truth for the checked file
        # set (scripts/format-dirs.sh), shared with .githooks/pre-commit.
        run: bash scripts/format.sh --check --all

  strict-build:
    needs: [classify-release, validate-version]
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify-release.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          shell: ${{ matrix.shell }}
          cxx-compiler: ${{ matrix.cxx_compiler }}
          c-compiler: ${{ matrix.c_compiler }}
          build-type: ${{ matrix.build_type }}
          cmake-flags: ${{ matrix.cmake_flags }}
          mingw-test-case-floor: ${{ env.MINGW_TEST_CASE_FLOOR }}

  sanitizer:
    needs: [classify-release, validate-version]
    runs-on: ubuntu-24.04
    name: AddressSanitizer
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake pkg-config g++-14 \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev
      - name: Configure (ASan)
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          -DGLFW_BUILD_WAYLAND=OFF
      - name: Build
        run: cmake --build build
      - name: Test (ASan)
        run: |
          cd build
          ASAN_OPTIONS=halt_on_error=1:detect_leaks=0 ctest --output-on-failure -E "Benchmark|test_ui"

  package:
    needs: [classify-release, validate-version]
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux package build
            shell: bash
            cxx_compiler: g++-14
            c_compiler: gcc-14
            cmake_flags: -DGLFW_BUILD_WAYLAND=OFF
            # Release: these artifacts are attached to the GitHub release, so
            # they must be optimized (no Debug asserts / -O0).
            build_type: Release
            artifact_name: build-linux
          - os: windows-latest
            label: Windows package build
            shell: msys2 - {0}
            cxx_compiler: g++
            c_compiler: gcc
            cmake_flags: ""
            build_type: Release
            artifact_name: build-windows

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v6

      # Release-facing: the exact Release build that ships is configured, built,
      # and tested here on every tag. strict-build never builds a Release leg.
      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          shell: ${{ matrix.shell }}
          cxx-compiler: ${{ matrix.cxx_compiler }}
          c-compiler: ${{ matrix.c_compiler }}
          build-type: ${{ matrix.build_type }}
          cmake-flags: ${{ matrix.cmake_flags }}
          mingw-test-case-floor: ${{ env.MINGW_TEST_CASE_FLOOR }}

      - name: Collect MinGW runtime DLLs
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          mkdir -p mingw-dlls
          # A missing runtime DLL fails this step instead of shipping a broken zip.
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [ ! -f "/mingw64/bin/$dll" ]; then
              echo "ERROR: required MinGW runtime DLL is missing: /mingw64/bin/$dll"
              exit 1
            fi
            cp "/mingw64/bin/$dll" mingw-dlls/
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/bin/tiny-rf-simulator${{ runner.os == 'Windows' && '.exe' || '' }}
            build/bin/rf-sim-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
            mingw-dlls/

  release:
    needs: [classify-release, validate-version, format, strict-build, sanitizer, package]
    if: >-
      always() &&
      needs.validate-version.result == 'success' &&
      needs.format.result == 'success' &&
      needs.sanitizer.result == 'success' &&
      needs.package.result == 'success' &&
      needs.strict-build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes from changelog
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Linux binaries
        run: |
          cp artifacts/build-linux/build/bin/tiny-rf-simulator rf-simulator-linux
          cp artifacts/build-linux/build/bin/rf-sim-mcp rf-sim-mcp
          chmod +x rf-simulator-linux rf-sim-mcp
          tar czf rf-simulator-linux-x86_64.tar.gz rf-simulator-linux rf-sim-mcp
          tar -tzf rf-simulator-linux-x86_64.tar.gz | grep -Fx 'rf-simulator-linux'
          tar -tzf rf-simulator-linux-x86_64.tar.gz | grep -Fx 'rf-sim-mcp'

      - name: Package Windows binaries + DLLs
        run: |
          mkdir -p rf-simulator-windows
          cp artifacts/build-windows/build/bin/tiny-rf-simulator.exe rf-simulator-windows/
          cp artifacts/build-windows/build/bin/rf-sim-mcp.exe rf-simulator-windows/
          cp artifacts/build-windows/mingw-dlls/*.dll rf-simulator-windows/
          zip -r rf-simulator-windows-x86_64.zip rf-simulator-windows/

      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            rf-simulator-linux-x86_64.tar.gz
            rf-simulator-windows-x86_64.zip
          draft: true
