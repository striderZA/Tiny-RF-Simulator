name: Docs

on:
  push:
    branches: [master]
    paths: [docs/**, scripts/check-docs-links.py, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Broken-link gate
        run: python scripts/check-docs-links.py docs
